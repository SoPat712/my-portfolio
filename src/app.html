<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0d0f0c" />
		<script>
			// Before first paint: apply the saved colorscheme, and cover the desktop until the boot log starts.
			(function () {
				var root = document.documentElement;
				try {
					var r = localStorage.getItem("patra-rice");
					if (r === "paper" || r === "sodium" || r === "oxide") root.dataset.rice = r;
				} catch (e) {}
				if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
					root.dataset.booting = "";
					setTimeout(function () { delete root.dataset.booting; }, 10000);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
